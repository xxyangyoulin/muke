name: Rust rebuild

on:
  push:
    branches:
      - '**'
    paths:
      - 'VERSION'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'migrations/**'
      - 'tests/*.rs'
      - 'frontend/**'
      - 'tests/rust/**'
      - 'examples/standalone-plugin/**'
      - 'public/assets/**'
      - 'tests/cdp.cjs'
      - 'tests/fixtures/rss/**'
      - 'app.php'
      - 'config.default.php'
      - 'public/index.php'
      - 'src/**'
      - 'plugins/**'
      - 'bin/**'
      - 'scripts/**'
      - 'Dockerfile.rust'
      - 'docs/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'VERSION'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'migrations/**'
      - 'tests/*.rs'
      - 'frontend/**'
      - 'tests/rust/**'
      - 'examples/standalone-plugin/**'
      - 'public/assets/**'
      - 'tests/cdp.cjs'
      - 'tests/fixtures/rss/**'
      - 'app.php'
      - 'config.default.php'
      - 'public/index.php'
      - 'src/**'
      - 'plugins/**'
      - 'bin/**'
      - 'scripts/**'
      - 'Dockerfile.rust'
      - 'docs/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, mbstring, curl, fileinfo, zip
      - name: Install ImageMagick and Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick build-essential perl pkg-config
          sudo ln -sf "$(command -v convert)" /usr/local/bin/magick
          if [ ! -x /usr/bin/google-chrome ]; then
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y -qq ./google-chrome-stable_current_amd64.deb
          fi
      - name: Rust checks
        run: |
          cargo fmt --check
          cargo fmt --manifest-path examples/standalone-plugin/Cargo.toml --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find frontend plugins examples/standalone-plugin/frontend -name '*.js' -print0)
      - name: API, browser and task contracts
        run: |
          cargo test --locked --test rust_export -- --ignored
          python3 tests/rust/core.py
          python3 tests/rust/contract.py --report /tmp/muke-rust-baseline.json
          python3 tests/rust/plugins.py
          python3 tests/rust/wallpapers.py
          python3 tests/rust/external.py
          python3 tests/rust/llm.py
      - uses: actions/upload-artifact@v4
        with:
          name: rust-prototype-baseline
          path: /tmp/muke-rust-baseline.json
