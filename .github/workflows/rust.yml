name: Rust CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'VERSION'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'migrations/**'
      - 'tests/*.rs'
      - 'frontend/**'
      - 'tests/rust/**'
      - 'tests/run.sh'
      - 'tests/fixtures/**'
      - 'examples/standalone-plugin/**'
      - 'tests/cdp.cjs'
      - 'src/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '.github/workflows/release.yml'
      - 'docs/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'VERSION'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'migrations/**'
      - 'tests/*.rs'
      - 'frontend/**'
      - 'tests/rust/**'
      - 'tests/run.sh'
      - 'tests/fixtures/**'
      - 'examples/standalone-plugin/**'
      - 'tests/cdp.cjs'
      - 'src/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '.github/workflows/release.yml'
      - 'docs/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ImageMagick and Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick libheif-plugin-aomenc libheif-plugin-aomdec build-essential perl pkg-config
          sudo ln -sf "$(command -v convert)" /usr/local/bin/magick
          if [ ! -x /usr/bin/google-chrome ]; then
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y -qq ./google-chrome-stable_current_amd64.deb
          fi
      - name: Rust, API, browser and task checks
        run: bash tests/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rust-contract-report
          path: /tmp/muke-rust-baseline.json
