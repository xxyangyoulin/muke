[package]
name = "muke"
version = "0.4.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
curl = { version = "0.4", features = ["static-curl", "static-ssl"] }
roxmltree = "0.21"
encoding_rs = "0.8"
sha1 = "0.10"
url = "2"
argon2 = "0.5"
bcrypt = "0.17"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
getrandom = "0.4"
hex = "0.4"
regex = "1"
sha2 = "0.10"
subtle = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
md-5 = "0.10"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
pulldown-cmark = "0.13"
ammonia = "4"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "time", "fs"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["fs", "set-header"] }

tempfile = "3"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.12"

[profile.release]
strip = "symbols"
lto = "thin"
